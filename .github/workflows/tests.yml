name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Ueberholte Laeufe auf demselben Branch abbrechen, statt sie zu Ende laufen zu lassen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Die Testsuite laeuft zweimal: lokal und hier zuerst gegen SQLite (schnell,
    # In-Memory), danach gegen die Engine, auf der LAPP produktiv laeuft.
    # Grund: SQLite kennt keinen Boolean-Typ und keine strenge GROUP-BY-Pruefung
    # -- eine ganze Fehlerklasse ist dort schlicht nicht testbar.
    services:
      postgres:
        # Bewusst der Major-Tag statt eines Digests: geprueft werden soll immer
        # der aktuelle Stand der Zielversion, nicht ein eingefrorener Patch.
        image: postgres:18
        env:
          POSTGRES_DB: lapp_testing
          POSTGRES_USER: lapp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # LAPP laeuft auf genau einer Runtime -- Zielversion, kein Versionsfaecher.
          php-version: '8.5'
          # pdo_pgsql wird nur hier gebraucht: lokal laeuft die Suite auf SQLite.
          extensions: pdo_pgsql
          tools: composer:v2
          # Keine Coverage-Erhebung im Projekt -> Xdebug waere reiner Bremsklotz.
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Determine Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-tests-${{ hashFiles('composer.lock') }}
          restore-keys: composer-tests-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Run Tests (SQLite)
        run: php artisan test

      # Dieselbe Suite gegen das Deployment-Ziel. Die Variablen greifen, obwohl
      # phpunit.xml eigene <env>-Eintraege mitbringt: PHPUnit setzt die nur,
      # wenn die Variable noch nicht in der Umgebung steht (kein force="true").
      - name: Run Tests (PostgreSQL 18)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: lapp_testing
          DB_USERNAME: lapp
          DB_PASSWORD: secret
        run: php artisan test

      # Bewusst als letzter Schritt: ein neues Advisory in einer fremden
      # Abhaengigkeit soll das Testergebnis nicht verdecken.
      # --locked prueft exakt den eingecheckten Stand der composer.lock.
      # --abandoned=report meldet verwaiste Pakete, bricht aber nicht ab --
      # das ist ein Wartungs-, kein Sicherheitsproblem.
      - name: Audit Dependencies
        run: composer audit --locked --abandoned=report
